apiVersion: apps/v1
kind: Deployment
metadata:
  name: cha-broken
  namespace: cha-express
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cha-broken
  template:
    metadata:
      labels:
        app: cha-broken
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpinee
          envFrom:
            - configMapRef:
                name: cha-confg
---
apiVersion: v1
kind: Service
metadata:
  name: cha-broken-svc
  namespace: cha-express
spec:
  selector:
    app: cha-brokn
  ports:
    - port: 80
      targetPort: 8080
