apiVersion: apps/v1
kind: Deployment
metadata:
  name: cha-web
  namespace: cha-express
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cha-web
  template:
    metadata:
      labels:
        app: cha-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: cha-config
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cha-secret
                  key: ADMIN_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: cha-config
            items:
              - key: index.html
                path: index.html
